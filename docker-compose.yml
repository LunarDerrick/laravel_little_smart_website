services:
  app:
    # image: bitnami/laravel:11
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "8000:80"
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_DATABASE: littlesmartdb
      DB_USERNAME: fypdev
      DB_PASSWORD: "6MRMijcbL_SeHR]a"
    networks:
      - laravel_network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: littlesmartdb
      MYSQL_USER: fypdev
      MYSQL_PASSWORD: "6MRMijcbL_SeHR]a"
    ports:
      - "3307:3306"
    networks:
      - laravel_network
    volumes:
      - db_data:/var/lib/mysql

